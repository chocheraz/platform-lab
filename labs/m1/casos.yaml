# Casos de prueba del Lab 1.2. Cada pod tiene un nombre que dice qué debería pasar.
apiVersion: v1
kind: Pod
metadata: { name: debe-fallar-privilegiado, namespace: demo }
spec:
  containers:
  - { name: app, image: "app:1.0", securityContext: { privileged: true } }
---
apiVersion: v1
kind: Pod
metadata: { name: debe-pasar-explicito, namespace: demo }
spec:
  containers:
  - { name: app, image: "app:1.0", securityContext: { privileged: false } }
---
apiVersion: v1
kind: Pod
metadata: { name: debe-pasar-sin-securitycontext, namespace: demo }
spec:
  containers:
  - { name: app, image: "app:1.0" }
---
apiVersion: v1
kind: Pod
metadata: { name: debe-fallar-init-privilegiado, namespace: demo }
spec:
  initContainers:
  - { name: preparar, image: "app:1.0", securityContext: { privileged: true } }
  containers:
  - { name: app, image: "app:1.0", securityContext: { privileged: false } }
---
apiVersion: v1
kind: Pod
metadata: { name: debe-fallar-efimero-privilegiado, namespace: demo }
spec:
  containers:
  - { name: app, image: "app:1.0", securityContext: { privileged: false } }
  ephemeralContainers:
  - { name: debugger, image: "busybox:1.36", securityContext: { privileged: true } }
