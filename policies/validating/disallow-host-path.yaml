apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: "Prohibir volúmenes hostPath"
    policies.kyverno.io/category: "Pod Security Standards (baseline)"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/description: >-
      Un volumen hostPath expone el sistema de archivos del nodo al contenedor. Equivale a PSS baseline, control 'HostPath Volumes'.
spec:
  # Audit: registra el incumplimiento en los PolicyReport, no bloquea.
  validationActions: [Audit]
  # Ignore: si Kyverno no responde, esta política no frena el clúster.
  # Para una política que solo audita, bloquear el clúster no tiene sentido.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage]
  validations:
  - expression: >-
      object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
    messageExpression: >-
      'Volúmenes hostPath no permitidos: ' +
      object.spec.volumes.filter(v, has(v.hostPath)).map(v, v.name + ' -> ' + v.hostPath.path).join(', ')
